<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/ttkbootstrap@1.10.0/dist/css/ttkbootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-primary">注册授权</h3>

            {% if success %}
                <div class="alert alert-success" role="alert">
                    注册成功！授权密钥已发送至您的邮箱，请注意查收。
                </div>
            {% elif error %}
                <div class="alert alert-danger" role="alert">
                    <p style="color:red;">{{ error }}</p>
                </div>
            {% endif %}

            <form method="post">
                <div class="form-group mb-3">
                    <label for="email">邮箱地址</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="请输入您的邮箱" required>
                </div>
                <button type="submit" class="btn btn-primary">提交注册</button>
            </form>
        </div>
    </div>
</body>
</html>
